# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = deadly_corridor.wad

# Skill 5 is reccomanded for the scenario to be a challenge.
doom_skill = 5

# Rewards
death_penalty = 100
living_reward = -1

# Rendering options
screen_resolution = RES_160X120  
screen_format = RGB24            
render_hud = false
render_crosshair = false
render_weapon = true
render_decals = false
render_particles = false
window_visible = false           # Ponlo en True solo cuando quieras mirar

episode_timeout = 2100

# Available buttons
available_buttons =
    { 
        MOVE_FORWARD
        MOVE_BACKWARD
        TURN_LEFT
        TURN_RIGHT
        ATTACK
        USE
    }

# Game variables that will be in the state
available_game_variables = { AMMO2 HEALTH KILLCOUNT }

mode = PLAYER
